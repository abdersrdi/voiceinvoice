# Codemagic: builds a signed .ipa (app + widget extension) and uploads it to TestFlight.
# Started manually from the Codemagic UI (no automatic trigger, to save build minutes).
# Unit tests run on every push in GitHub Actions (.github/workflows/ios.yml).
#
# One-time setup is listed in README.md ("Releasing"). In short:
#   1. Teams > Integrations > App Store Connect: add an API key named "VoiceInvoice".
#   2. Add a secure variable CERTIFICATE_PRIVATE_KEY (an RSA private key, used to create
#      the distribution certificate) to a group named "signing".
#   3. Set APP_STORE_APPLE_ID below (numeric Apple ID of the app in App Store Connect).

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: VoiceInvoice
    environment:
      xcode: latest
      groups:
        - signing
      vars:
        # Numeric "Apple ID" shown under App Information in App Store Connect.
        APP_STORE_APPLE_ID: "0000000000"
        APP_BUNDLE_ID: com.abdersrdi.voiceinvoice
        WIDGET_BUNDLE_ID: com.abdersrdi.voiceinvoice.widgets
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Use the next TestFlight build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          NEXT=$((LATEST + 1))
          echo "Latest TestFlight build: $LATEST, using $NEXT"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$NEXT\"/" project.yml
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files for the app and the widget extension
        script: |
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" \
            --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build signed ipa
        script: |
          xcode-project build-ipa \
            --project "VoiceInvoice.xcodeproj" \
            --scheme "VoiceInvoice"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
