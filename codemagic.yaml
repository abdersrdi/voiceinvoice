# Codemagic: signed builds of the app (with its widget extension).
# Both workflows are started manually from the Codemagic UI, to save build minutes.
# Unit tests run on every push in GitHub Actions (.github/workflows/ios.yml).
#
# Setup is explained step by step in docs/APPLE_SETUP.md. In short:
#   1. Create a variable group named "VoiceInvoice" with these SECURE variables:
#        APP_STORE_CONNECT_ISSUER_ID       Issuer ID of your App Store Connect API key
#        APP_STORE_CONNECT_KEY_IDENTIFIER  Key ID of that key
#        APP_STORE_CONNECT_PRIVATE_KEY     the whole contents of the .p8 file (BEGIN and END lines too)
#        CERTIFICATE_PRIVATE_KEY           an RSA private key used to create the distribution certificate
#      No Teams plan is needed: the Codemagic tools read these variables directly.
#   2. APP_STORE_APPLE_ID below is the numeric Apple ID of the app in App Store Connect.
#
# Workflows:
#   ios-development  development-signed build you install on your own iPhone. Run it FIRST:
#                    development builds are what create the iCloud (CloudKit) schema.
#   ios-testflight   App Store-signed build uploaded to TestFlight.

workflows:
  ios-development:
    name: iOS development build (iPhone install, creates CloudKit schema)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - VoiceInvoice
      vars:
        APP_BUNDLE_ID: cc.voiceinvoice.app
        WIDGET_BUNDLE_ID: cc.voiceinvoice.app.widgets
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch development signing files (needs your iPhone registered in the developer portal)
        script: |
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" \
            --type IOS_APP_DEVELOPMENT --create \n            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_DEVELOPMENT --create \n            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build development ipa
        script: |
          xcode-project build-ipa \
            --project "VoiceInvoice.xcodeproj" \
            --scheme "VoiceInvoice"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - VoiceInvoice
      vars:
        # Numeric "Apple ID" shown under App Information in App Store Connect.
        APP_STORE_APPLE_ID: "6833108908"
        APP_BUNDLE_ID: cc.voiceinvoice.app
        WIDGET_BUNDLE_ID: cc.voiceinvoice.app.widgets
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Use the next TestFlight build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          NEXT=$((LATEST + 1))
          echo "Latest TestFlight build: $LATEST, using $NEXT"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$NEXT\"/" project.yml
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files for the app and the widget extension
        script: |
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" \
            --type IOS_APP_STORE --create \n            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE --create \n            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build signed ipa
        script: |
          xcode-project build-ipa \
            --project "VoiceInvoice.xcodeproj" \
            --scheme "VoiceInvoice"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
