name: VoiceInvoice
options:
  bundleIdPrefix: cc.voiceinvoice
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  VoiceInvoice:
    type: application
    platform: iOS
    sources:
      - VoiceInvoice
      - Shared
    dependencies:
      - target: VoiceInvoiceWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.voiceinvoice.app
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: VoiceInvoice/Info.plist
      properties:
        CFBundleDisplayName: Talkstamp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - fr
          - es
          - it
          - zh-Hans
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: cc.voiceinvoice.app
            CFBundleURLSchemes:
              - voiceinvoice
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Talkstamp listens while you dictate invoice items.
        NSSpeechRecognitionUsageDescription: Talkstamp turns your dictation into invoice line items.
        NSCameraUsageDescription: Talkstamp scans your company stamp with the camera.
    entitlements:
      path: VoiceInvoice/VoiceInvoice.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.cc.voiceinvoice.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.cc.voiceinvoice.app
  VoiceInvoiceWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - VoiceInvoiceWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.voiceinvoice.app.widgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: VoiceInvoiceWidgets/Info.plist
      properties:
        CFBundleDisplayName: Talkstamp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: VoiceInvoiceWidgets/VoiceInvoiceWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cc.voiceinvoice.app
  VoiceInvoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VoiceInvoiceTests
    dependencies:
      - target: VoiceInvoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.voiceinvoice.app.tests
        GENERATE_INFOPLIST_FILE: YES
  VoiceInvoiceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - VoiceInvoiceUITests
    dependencies:
      - target: VoiceInvoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.voiceinvoice.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VoiceInvoiceUI:
    build:
      targets:
        VoiceInvoice: all
    test:
      targets:
        - VoiceInvoiceUITests
  VoiceInvoice:
    build:
      targets:
        VoiceInvoice: all
    test:
      targets:
        - VoiceInvoiceTests
