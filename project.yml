name: VoiceInvoice
options:
  bundleIdPrefix: com.abdersrdi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  VoiceInvoice:
    type: application
    platform: iOS
    sources:
      - VoiceInvoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdersrdi.voiceinvoice
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: VoiceInvoice/Info.plist
      properties:
        CFBundleDisplayName: VoiceInvoice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: VoiceInvoice listens while you dictate invoice items.
        NSSpeechRecognitionUsageDescription: VoiceInvoice turns your dictation into invoice line items.
        NSCameraUsageDescription: VoiceInvoice scans your company stamp with the camera.
    entitlements:
      path: VoiceInvoice/VoiceInvoice.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.abdersrdi.voiceinvoice
        com.apple.developer.icloud-services:
          - CloudKit
  VoiceInvoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VoiceInvoiceTests
    dependencies:
      - target: VoiceInvoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdersrdi.voiceinvoice.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VoiceInvoice:
    build:
      targets:
        VoiceInvoice: all
    test:
      targets:
        - VoiceInvoiceTests
